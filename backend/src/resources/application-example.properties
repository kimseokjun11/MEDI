# 이 파일을 application.properties 로 복사한 뒤 빈 값을 채워서 사용하세요.
# application.properties 는 비밀값이 들어가므로 .gitignore 로 깃에 올리지 않습니다.

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bu_dev4
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO

# 이메일 발송 설정
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000

# 공공데이터포털 서비스키 (data.go.kr 마이페이지에서 발급)
# 의약품 개요정보(e약은요) API
public-data.drug-service-key=
# DUR 품목정보, 약국 정보 등 나머지 API
public-data.service-key=
